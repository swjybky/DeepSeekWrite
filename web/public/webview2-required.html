<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需要安装 WebView2 - DeepseekWrite</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: #1e293b;
        background: #f4efe4;
      }

      .backdrop {
        width: min(420px, 100%);
      }

      .dialog {
        overflow: hidden;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(15 23 42 / 0.2);
      }

      .dialog-head {
        display: grid;
        grid-template-columns: 2rem minmax(0, 1fr);
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 1rem 0.75rem;
      }

      .dialog-mark {
        width: 2rem;
        height: 2rem;
        display: inline-grid;
        place-items: center;
        border: 1px solid #fde68a;
        border-radius: 50%;
        background: #fffbeb;
        color: #b45309;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1;
      }

      .dialog-head h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .dialog-body {
        padding: 0 1rem 1rem 3.75rem;
        color: #475569;
        font-size: 0.9rem;
        line-height: 1.65;
      }

      .dialog-body p {
        margin: 0;
      }

      .dialog-body p + p {
        margin-top: 0.6rem;
      }

      .dialog-details {
        margin-top: 0.75rem;
        padding: 0.75rem 0.85rem;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #f8fafc;
        font-size: 0.82rem;
        word-break: break-word;
      }

      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        padding: 0 1rem 1rem;
      }

      .btn {
        appearance: none;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 0.5rem 0.9rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-primary {
        border-color: #b45309;
        background: #f59e0b;
        color: #fff;
      }

      .btn-primary:hover {
        background: #d97706;
      }
    </style>
  </head>
  <body>
    <div class="backdrop">
      <section class="dialog" role="alertdialog" aria-labelledby="wv2-title" aria-describedby="wv2-desc">
        <header class="dialog-head">
          <span class="dialog-mark" aria-hidden="true">!</span>
          <h1 id="wv2-title">需要安装 WebView2 运行时</h1>
        </header>
        <div class="dialog-body">
          <p id="wv2-desc">
            DeepseekWrite 依赖 Microsoft Edge WebView2 才能显示界面。当前系统未检测到该组件，因此无法正常加载写作工作台。
          </p>
          <p>请先安装 WebView2 Runtime，安装完成后<strong>重新启动</strong>本应用。</p>
          <div class="dialog-details">
            下载地址：<br />
            <a id="wv2-link" href="https://developer.microsoft.com/microsoft-edge/webview2/" target="_blank" rel="noopener noreferrer">
              https://developer.microsoft.com/microsoft-edge/webview2/
            </a>
          </div>
        </div>
        <footer class="dialog-foot">
          <button type="button" class="btn btn-primary" id="wv2-open">打开下载页面</button>
        </footer>
      </section>
    </div>
    <script>
      ;(function () {
        var downloadUrl = 'https://developer.microsoft.com/microsoft-edge/webview2/'
        var openBtn = document.getElementById('wv2-open')
        var link = document.getElementById('wv2-link')

        function openDownload() {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.open_external_url) {
            window.pywebview.api.open_external_url(downloadUrl)
            return
          }
          window.open(downloadUrl, '_blank', 'noopener,noreferrer')
        }

        if (openBtn) openBtn.addEventListener('click', openDownload)
        if (link) {
          link.addEventListener('click', function (event) {
            if (window.pywebview && window.pywebview.api && window.pywebview.api.open_external_url) {
              event.preventDefault()
              openDownload()
            }
          })
        }
      })()
    </script>
  </body>
</html>
