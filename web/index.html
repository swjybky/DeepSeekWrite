<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="256x256" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepWrite</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite">
        <p class="boot-splash-title">DeepWrite</p>
        <p class="boot-splash-hint">正在启动…</p>
      </div>
    </div>
    <style>
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 0;
        font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif;
        color: #5c5244;
        background: #f4efe4;
      }
      .boot-splash-title {
        margin: 0;
        font-size: 1.125rem;
        letter-spacing: 0.1em;
      }
      .boot-splash-hint {
        margin: 0;
        font-size: 0.875rem;
        color: #8a7f6e;
      }
    </style>
    <script>
      function isBenignResizeObserverError(message) {
        return (
          message &&
          (message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            message.indexOf('ResizeObserver loop limit exceeded') !== -1)
        )
      }
      function escapeBootMessage(message) {
        return String(message)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
      }
      window.addEventListener(
        'error',
        function (event) {
          var msg = event.message || '脚本加载失败'
          if (isBenignResizeObserverError(msg)) {
            event.preventDefault()
            return
          }
          var root = document.getElementById('root')
          if (
            !root ||
            document.documentElement.dataset.deepSeekWriteMounted === '1' ||
            event.filename === location.href
          ) {
            return
          }
          root.innerHTML =
            '<div class="boot-splash" role="alert"><p class="boot-splash-title">DeepWrite</p>' +
            '<p class="boot-splash-hint" style="max-width:28rem;text-align:center;">' +
            escapeBootMessage(msg) +
            '</p></div>'
        },
        true,
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
